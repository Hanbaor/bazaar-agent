[project]
name = "bazaar-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.37.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2,<3",
    "sqlalchemy>=2.1.6",
]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
